name: Windows CI

on:
  pull_request:
    paths:
      - ".github/workflows/windows-ci.yml"
      - ".github/workflows/windows-release.yml"
      - ".github/workflows/automatic-beta-release.yml"
      - ".github/dependabot.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "apps/**"
      - "crates/**"
      - "src/**"
      - "src-tauri/**"

concurrency:
  group: windows-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Windows app
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            apps/scrypuppy-iced/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock', 'apps/scrypuppy-iced/Cargo.lock') }}
          restore-keys: |
            windows-rust-

      - name: Resolve and validate build metadata
        id: metadata
        shell: pwsh
        run: ./scripts/release-metadata.ps1 -GitHubOutput

      - name: Test portable SHA-256 helper
        shell: pwsh
        run: |
          $portableHash = ./scripts/file-sha256.ps1 -Path package-lock.json
          $nodeHash = node -e "const crypto = require('node:crypto'); const fs = require('node:fs'); process.stdout.write(crypto.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'));" package-lock.json
          if ($portableHash -ne $nodeHash) {
            throw "The portable SHA-256 helper returned an unexpected digest."
          }
          Write-Host "Portable SHA-256 helper verified: $portableHash"

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test:frontend

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Check Iced formatting
        run: cargo fmt --manifest-path apps/scrypuppy-iced/Cargo.toml --check

      - name: Check Iced migration build
        run: cargo check --manifest-path apps/scrypuppy-iced/Cargo.toml --locked

      - name: Lint Iced migration
        run: cargo clippy --manifest-path apps/scrypuppy-iced/Cargo.toml --locked -- -D warnings

      - name: Test Iced migration
        run: cargo test --manifest-path apps/scrypuppy-iced/Cargo.toml --locked

      - name: Check shared Rust core formatting
        run: cargo fmt --manifest-path crates/scrypuppy-core/Cargo.toml --check

      - name: Test shared Rust core
        run: cargo test --manifest-path crates/scrypuppy-core/Cargo.toml --locked

      - name: Lint shared Rust core
        run: cargo clippy --manifest-path crates/scrypuppy-core/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build optimized Iced migration executable
        run: cargo build --release --manifest-path apps/scrypuppy-iced/Cargo.toml --locked

      - name: Upload Iced migration executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrypuppy-iced-windows-${{ github.run_number }}
          path: apps/scrypuppy-iced/target/release/scrypuppy-iced.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build and smoke-test unsigned Windows installer
        env:
          REQUIRE_UPDATER_SIGNATURE: false
        run: npm run build:windows

      - name: Build Iced NSIS migration candidate
        run: ./scripts/build-iced-windows.ps1

      - name: Smoke-test Iced NSIS install and uninstall
        run: ./scripts/test-iced-windows-installer.ps1

      - name: Download released Tauri migration baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baselineRoot = Join-Path $env:RUNNER_TEMP "scrypuppy-tauri-baseline"
          New-Item -ItemType Directory -Force -Path $baselineRoot | Out-Null
          gh release download v1.0.0-beta.12 `
            --repo Lucas-Damasceno/ScryPuppy `
            --pattern "ScryPuppy_beta_installer_v1.0.12.exe" `
            --pattern "ScryPuppy_beta_installer_v1.0.12.exe.sha256" `
            --pattern "ScryPuppy_beta_installer_v1.0.12.exe.sig" `
            --dir $baselineRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the released Tauri beta.12 migration baseline."
          }
          $installer = Join-Path $baselineRoot "ScryPuppy_beta_installer_v1.0.12.exe"
          $checksumFile = "$installer.sha256"
          $expectedHash = [regex]::Match(
            (Get-Content -LiteralPath $checksumFile -Raw),
            '(?i)\b[0-9a-f]{64}\b'
          ).Value.ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $expectedHash -or $actualHash -ne $expectedHash) {
            throw "The released Tauri baseline failed SHA-256 validation."
          }
          "TAURI_BASELINE_INSTALLER=$installer" >> $env:GITHUB_ENV

      - name: Validate released Tauri to Iced upgrade
        shell: pwsh
        env:
          ICED_INSTALLER: ${{ steps.metadata.outputs.iced_installer_path }}
        run: ./scripts/test-tauri-to-iced-upgrade.ps1 `
          -TauriInstaller $env:TAURI_BASELINE_INSTALLER `
          -TauriSignature "$env:TAURI_BASELINE_INSTALLER.sig" `
          -IcedInstaller $env:ICED_INSTALLER

      - name: Create SHA-256 checksum
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.metadata.outputs.installer_path }}
          INSTALLER_NAME: ${{ steps.metadata.outputs.installer_name }}
          CHECKSUM_PATH: ${{ steps.metadata.outputs.checksum_path }}
        run: |
          if (-not (Test-Path -LiteralPath $env:INSTALLER_PATH)) {
            throw "Expected installer was not created: $env:INSTALLER_PATH"
          }
          $hash = ./scripts/file-sha256.ps1 -Path $env:INSTALLER_PATH
          "$hash  $env:INSTALLER_NAME" | Set-Content -LiteralPath $env:CHECKSUM_PATH -Encoding ascii
          Write-Host "Installer SHA-256: $hash"

      - name: Upload short-lived validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ steps.metadata.outputs.installer_path }}
            ${{ steps.metadata.outputs.checksum_path }}
            ${{ steps.metadata.outputs.iced_installer_path }}
            ${{ steps.metadata.outputs.iced_checksum_path }}
          if-no-files-found: error
          retention-days: 1
