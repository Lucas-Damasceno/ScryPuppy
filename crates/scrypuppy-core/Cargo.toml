[package]
name = "scrypuppy-core"
version = "1.0.0-beta.12"
edition = "2021"
publish = false

[dependencies]
aes-gcm = "0.10.3"
arboard = "=3.6.1"
chrono = "0.4"
fastembed = { version = "=5.17.3", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
html5ever = "0.38.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico", "bmp"] }
quick-xml = "0.41.0"
regex = "1.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5.8"
unword = "=0.2.0"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
rdocx = { version = "=0.17.0", default-features = false, features = ["system-fonts"] }
