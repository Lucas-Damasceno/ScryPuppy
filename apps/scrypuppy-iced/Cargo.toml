[package]
name = "scrypuppy-iced"
version = "1.0.0-beta.12"
edition = "2021"
publish = false

[dependencies]
chrono = "0.4"
dirs = "6"
enigo = "0.2.1"
global-hotkey = "=0.8.0"
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "image-without-codecs"] }
keyring = "4.1.4"
rfd = "=0.16.0"
uuid = { version = "1", features = ["v4"] }
url = "2.5.8"
regex = "1.13.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }
scrypuppy-core = { path = "../../crates/scrypuppy-core" }

[target.'cfg(windows)'.dependencies]
active-win-pos-rs = "0.11.0"
raw-window-handle = "0.6"
tray-icon = "=0.21.2"
windows = { version = "0.61.3", features = ["Data_Pdf", "Storage", "Storage_Streams", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
